---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: false
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false
# Additional robots to load
robots:
  ground:
    module: env/ground

# Collision constraint
collisions:
- type: collision
  useMinimal: true

# Implement some additional text states
states: 
  FSM_Compliance:
    base: Meta
    Managed: false
    StepByStep: true

    transitions:
      - [MonodzukuriKinovaDemo_Compliance, OK, MonodzukuriKinovaDemo_Initial, Auto]

  FSM_NSCompliant:
    base: Meta
    Managed: false
    StepByStep: true

    transitions:
      - [MonodzukuriKinovaDemo_NSCompliant, OK, MonodzukuriKinovaDemo_Initial, Auto]


# Transitions map
transitions:
  - [MonodzukuriKinovaDemo_Initial, COMPLI, MonodzukuriKinovaDemo_Compliance, Auto]
  - [MonodzukuriKinovaDemo_Compliance, OK, MonodzukuriKinovaDemo_Initial, Auto]
  - [MonodzukuriKinovaDemo_Initial, NS, MonodzukuriKinovaDemo_NSCompliant, Auto]
  - [MonodzukuriKinovaDemo_NSCompliant, OK, MonodzukuriKinovaDemo_Initial, Auto]
  - [MonodzukuriKinovaDemo_Initial, MINJERK, MonodzukuriKinovaDemo_MinJerk, Auto]
  - [MonodzukuriKinovaDemo_MinJerk, OK, MonodzukuriKinovaDemo_Initial, Auto]
  - [MonodzukuriKinovaDemo_Initial, SIN, MonodzukuriKinovaDemo_SinCompliance, Auto]
  - [MonodzukuriKinovaDemo_SinCompliance, OK, MonodzukuriKinovaDemo_Initial, Auto]
  - [MonodzukuriKinovaDemo_NSCompliant, DC, MonodzukuriKinovaDemo_DCompliant, Auto]
  - [MonodzukuriKinovaDemo_DCompliant, NS, MonodzukuriKinovaDemo_NSCompliant, Auto]
  - [MonodzukuriKinovaDemo_DCompliant, OK, MonodzukuriKinovaDemo_Initial, Auto]
  - [MonodzukuriKinovaDemo_DCompliant, RUN, MonodzukuriKinovaDemo_wayPointDCompliant, Auto]
  - [MonodzukuriKinovaDemo_wayPointDCompliant, OK, MonodzukuriKinovaDemo_DCompliant, Auto]
  # - [MonodzukuriKinovaDemo_Initial, OK, MonodzukuriKinovaDemo_Calibration, Auto]
  # - [MonodzukuriKinovaDemo_Calibration, OK, MonodzukuriKinovaDemo_Initial, Auto]

# Initial state
init: MonodzukuriKinovaDemo_Initial

Plugins: [ RosForceSensor, ExternalForcesEstimator, mc_joystick_plugin ]

robots:
  Kinova:
    tool_frame: "DS4_tool"

  KinovaBota:
    tool_frame: "FT_sensor_wrench"

tool_frame: "end_effector_link"

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      config:
        velocity: encoderVelocities
